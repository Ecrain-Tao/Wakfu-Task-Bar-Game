name: Publish game update

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v0.3.0-alpha (must match app VERSION)'
        required: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            archive: Wakfu-Task-Bar-Game-macOS-Intel.zip
          - os: windows-latest
            archive: Wakfu-Task-Bar-Game-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging tools
        run: python -m pip install --upgrade pip pyinstaller certifi
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Wakfu-Task-Bar-Game main.py
      - name: Archive application
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile("${{ matrix.archive }}", "w", ZIP_DEFLATED) as archive:
              for item in Path("dist").rglob("*"):
                  if item.is_file():
                      archive.write(item, item.relative_to("dist"))
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files
      - name: Publish binaries only to public repository
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::Set PUBLIC_RELEASES_TOKEN in the private repository's Actions secrets"
            exit 1
          fi
          VERSION="v${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^v[0-9]+\\.[0-9]+\\.[0-9]+(-(alpha|beta|rc)(\\.[0-9]+)?)?$ ]]; then
            echo "::error::Invalid release version: ${VERSION}"
            exit 1
          fi
          python -m pip install certifi
          APP_VERSION="$(python -c 'from wakfu_task_bar.updater import VERSION; print(VERSION)')"
          if [[ "${VERSION}" != "v${APP_VERSION}" ]]; then
            echo "::error::Version mismatch: release ${VERSION}, app v${APP_VERSION}"
            exit 1
          fi
          FLAGS=(--latest)
          NOTES="Nouvelle version du jeu pour macOS Intel et Windows."
          if [[ "${VERSION}" == *-* ]]; then
            FLAGS=(--prerelease)
            NOTES="Version expérimentale : moteur de combat Iop V1. Sauvegardez vos données avant de tester."
          fi
          gh release create "${VERSION}" release-files/*.zip \
            --repo Ecrain-Tao/Wakfu-Task-Bar-Game-Releases \
            --title "Wakfu Task Bar Game ${VERSION}" \
            --notes "${NOTES}" "${FLAGS[@]}"

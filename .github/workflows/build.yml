name: Build desktop apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: Wakfu-Task-Bar-Game-macOS-Intel
            archive: Wakfu-Task-Bar-Game-macOS-Intel.zip
          - os: windows-latest
            artifact: Wakfu-Task-Bar-Game-Windows
            archive: Wakfu-Task-Bar-Game-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Package
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Wakfu-Task-Bar-Game main.py
      - name: Create update archive
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path("dist")
          with ZipFile("${{ matrix.archive }}", "w", ZIP_DEFLATED) as z:
              for file in root.rglob("*"):
                  if file.is_file():
                      z.write(file, file.relative_to(root))
      - name: Upload update archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-update
          path: ${{ matrix.archive }}
          if-no-files-found: error
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
